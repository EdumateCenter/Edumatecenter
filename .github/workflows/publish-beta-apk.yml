name: Publish EduMate Android Beta APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android API 36
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK for testing
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature, manifest and file
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "$APK"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          cp "$APK" EduMateCenter-Android-beta.apk

      - name: Create public GitHub pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.2.0-beta.1 EduMateCenter-Android-beta.apk \
            --title "EduMate Center Android Beta 1.2.0" \
            --notes "EduMate Center beta Android app. This is a debug-signed TEST build, not an independently security-audited production release. Students should use the official EduMate website for account details and verify the source of APKs before installing." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduMateCenter-APK-build
          path: EduMateCenter-Android-beta.apk
          retention-days: 14
