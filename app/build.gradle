plugins { id 'com.android.application' }

android {
    namespace 'com.edumatecenter.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.edumatecenter.mobile'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
